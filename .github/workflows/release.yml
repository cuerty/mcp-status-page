name: Release

# Publish a GitHub Release with tag vX.Y.Z to ship X.Y.Z to PyPI. No need to bump pyproject.toml.
# PyPI side: trusted publisher for this repo, workflow release.yml, environment "pypi".
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Set package version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        # The tag is the source of truth: v0.2.0 publishes 0.2.0. uv rejects non-PEP 440 versions.
        run: uv version --no-sync "${TAG#v}"
      - run: uv run --locked pytest -q
      - run: uv run --locked pytest -m live -q
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-status-page/
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC); no API token stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv publish --trusted-publishing always
