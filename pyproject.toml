[project]
name = "mcp-status-page"
version = "0.1.0"
description = "MCP server that reports live status of developer services (GitHub, AWS, Azure, GCP, Cloudflare, OpenAI, ...) so agents can tell when a failure is upstream."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "status", "statuspage", "outage", "fastmcp"]
dependencies = [
    "fastmcp>=4.2,<5",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
mcp-status-page = "mcp_status_page.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = ["live: hits real status pages over the network"]
