# Built-in services. User config files use the same format; a user entry with
# the same key replaces the built-in one completely.
# `domains` match the host itself and any subdomain (github.com matches api.github.com).
# aws, azure, gcp and slack have fixed endpoints and need no url.

[services.github]
provider = "statuspage"
name = "GitHub"
url = "https://www.githubstatus.com"
aliases = ["gh"]
domains = ["github.com", "githubusercontent.com", "ghcr.io", "github.io", "githubassets.com"]

[services.cloudflare]
provider = "statuspage"
name = "Cloudflare"
url = "https://www.cloudflarestatus.com"
aliases = ["cf"]
domains = ["cloudflare.com", "workers.dev", "pages.dev", "cloudflarestorage.com"]

